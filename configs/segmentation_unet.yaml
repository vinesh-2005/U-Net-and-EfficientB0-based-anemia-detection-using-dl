input_size: [256, 256]
channels: 3
base_filters: 32
normalization: batch
activation: relu
dropout: 0.0
learning_rate: 0.0001
batch_size: 4
epochs: 100
patience: 15
dice_smoothing: 1.0
mask_threshold: 0.5
postprocess:
  min_object_pixels: 64
  fill_holes: false
  keep_components: 3
augmentation:
  rotation_degrees: 8
  shift_fraction: 0.05
  scale_fraction: 0.10
  brightness_delta: 0.08
  contrast_range: [0.9, 1.1]
  blur_probability: 0.05

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ANEMEIA Healthcare Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #0F766E;
            --primary-teal-hover: #0D9488;
            --primary-teal-subtle: #E6F4F2;
            --accent-cyan: #06B6D4;
            --bg-base: #F8FAFC;
            --bg-card: #FFFFFF;
            --heading-color: #0F172A;
            --body-text: #334155;
            --muted-text: #64748B;
            --border-color: #E2E8F0;
            --input-bg: #F8FBFC;
            --input-border: #CBD5E1;
            --danger-red: #DC2626;
            --danger-bg: #FEF2F2;
            --danger-border: #FCA5A5;
            --success-green: #059669;
            --success-bg: #ECFDF5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--body-text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
            width: 100%;
            flex: 1;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 32px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--heading-color);
            text-decoration: none;
        }

        .brand-icon {
            font-size: 24px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link {
            font-size: 14px;
            font-weight: 600;
            color: var(--muted-text);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary-teal);
        }

        .nav-btn-solid {
            font-size: 13.5px;
            font-weight: 700;
            color: #FFFFFF;
            background: var(--primary-teal);
            padding: 8px 18px;
            border-radius: 999px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-btn-solid:hover {
            background: var(--primary-teal-hover);
        }

        /* AUTH CARD */
        .auth-container {
            max-width: 440px;
            margin: 40px auto;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header .icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--primary-teal-subtle);
            color: var(--primary-teal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 16px auto;
        }

        .auth-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--heading-color);
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 13.5px;
            color: var(--muted-text);
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--input-border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--heading-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
            background: #FFFFFF;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary-teal) 0%, var(--primary-teal-hover) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(15, 118, 110, 0.25);
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(15, 118, 110, 0.35);
        }

        .error-alert {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-red);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13.5px;
            color: var(--muted-text);
        }

        .auth-footer a {
            color: var(--primary-teal);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .guest-link-box {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            text-align: center;
        }

        .guest-link-box a {
            font-size: 13px;
            color: var(--muted-text);
            text-decoration: none;
            font-weight: 600;
        }

        .guest-link-box a:hover {
            color: var(--heading-color);
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <span class="brand-icon">👁️</span>
            <span>AnemiaAI</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link">AI Screening</a>
            <a href="/#awarenessSection" class="nav-link">Nutritional Guidance</a>
            <a href="/dashboard" class="nav-link">Model Metrics</a>
            <a href="/history" class="nav-link">Screening History</a>
            <a href="/register" class="nav-btn-solid">Register</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="icon-badge">🔐</div>
                <h2>Clinician & Patient Login</h2>
                <p>Sign in to track your personal screening history</p>
            </div>

            {% if error %}
            <div class="error-alert">
                <span>⚠️</span>
                <div>{{ error }}</div>
            </div>
            {% endif %}

            <form method="POST">
                <div class="input-group">
                    <label for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" name="email" placeholder="name@example.com" required autofocus>
                </div>

                <div class="input-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">
                    Sign In to Portal
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Register here</a>
            </div>

            <div class="guest-link-box">
                <a href="/">Continue without login (Guest Screening) &rarr;</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
